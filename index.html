<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2F5E45">
<title>EA Part 1 — Daily</title>
<style>
  :root{
    --paper:#FBFAF6; --ink:#1F2A22; --muted:#6B7570; --line:#DCD9CF;
    --green:#2F5E45; --green-soft:#E3EEE7; --mark:#F5E663; --red:#B8412F; --red-soft:#F7E6E2;
    --serif:"Charter","Iowan Old Style",Georgia,serif;
    --sans:-apple-system,"SF Pro Text",system-ui,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{padding:calc(env(safe-area-inset-top) + 14px) 20px 12px;display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line)}
  header h1{font:600 17px/1 var(--sans);margin:0;letter-spacing:-.01em}
  header button{background:none;border:0;color:var(--muted);font:14px var(--sans);padding:4px 0}
  main{flex:1;padding:20px 20px calc(env(safe-area-inset-bottom) + 24px);max-width:560px;width:100%;margin:0 auto}
  h2{font:700 26px/1.15 var(--sans);letter-spacing:-.02em;margin:0 0 6px}
  .sub{color:var(--muted);font-size:15px;margin:0 0 20px}
  .lesson p, .rule{font-family:var(--serif);font-size:18px;line-height:1.55}
  .lesson p{margin:0 0 14px}
  .section-title{font:600 13px var(--sans);color:var(--green);margin:22px 0 8px}
  .rule{margin:0 0 12px;padding-left:14px;border-left:3px solid var(--green)}
  .rule b, .lesson b{background:linear-gradient(transparent 55%,var(--mark) 55%);font-weight:600}
  .trap{background:var(--red-soft);border-radius:8px;padding:12px 14px;font-family:var(--serif);font-size:17px;line-height:1.5;margin:6px 0 16px}
  .trap span{font:600 12px var(--sans);color:var(--red);display:block;margin-bottom:4px}
  .btn{display:block;width:100%;border:0;border-radius:10px;padding:15px;font:600 17px var(--sans);cursor:pointer}
  .btn.primary{background:var(--green);color:#fff}
  .btn.ghost{background:none;color:var(--green);border:1px solid var(--green)}
  .btn+.btn{margin-top:10px}
  .btn:disabled{opacity:.5}
  .home-card{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;background:#fff}
  .home-card h3{margin:0 0 4px;font:600 16px var(--sans)}
  .home-card p{margin:0;color:var(--muted);font-size:14px}
  .stat{font:700 34px/1 var(--sans);color:var(--green);letter-spacing:-.02em}
  .stats{display:flex;gap:24px;margin:8px 0 20px}
  .stats div small{display:block;color:var(--muted);font-size:13px;margin-top:4px}
  .list{list-style:none;padding:0;margin:0}
  .list li{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
  .list li button{background:none;border:0;color:var(--green);font:600 14px var(--sans);padding:6px 0}
  .list li .done{color:var(--muted)}
  .q{font-family:var(--serif);font-size:18px;line-height:1.5;margin:0 0 18px}
  .opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px 14px;font:16px/1.4 var(--sans);color:var(--ink);margin-bottom:8px;cursor:pointer}
  .opt.correct{border-color:var(--green);background:var(--green-soft)}
  .opt.wrong{border-color:var(--red);background:var(--red-soft)}
  .opt:disabled{cursor:default;color:var(--ink)}
  .explain{border-top:1px solid var(--line);margin-top:14px;padding-top:12px;font-family:var(--serif);font-size:16px;line-height:1.5}
  .explain.ok{color:var(--green)}
  .progress{height:4px;background:var(--line);border-radius:2px;margin-bottom:22px;overflow:hidden}
  .progress i{display:block;height:100%;background:var(--green);transition:width .25s}
  .tag{font:600 12px var(--sans);color:var(--muted);margin-bottom:8px}
  .tag.review{color:var(--red)}
  textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;padding:12px;font:16px/1.4 var(--sans);background:#fff;resize:vertical}
  .recap{font-family:var(--serif);font-size:17px;line-height:1.5;color:var(--muted);margin:0 0 18px}
  .score{font:700 56px/1 var(--sans);color:var(--green);letter-spacing:-.03em;margin:8px 0 4px}
  @media (prefers-reduced-motion:reduce){.progress i{transition:none}}
  .ftable{width:100%;border-collapse:collapse;margin-bottom:8px;font-size:14px}
  .ftable th{text-align:left;font:600 12px var(--sans);color:var(--muted);padding:6px 6px 6px 0;border-bottom:1px solid var(--line)}
  .ftable td{vertical-align:top;padding:9px 6px 9px 0;border-bottom:1px solid var(--line);line-height:1.4}
  .ftable td:last-child,.ftable th:last-child{padding-right:0}
  .fnum{font-weight:600;white-space:nowrap;width:18%}
  .fname{color:var(--muted);width:20%;font-size:13px}
  .fuse{font-family:var(--serif);font-size:14px}
  .fex{font-size:13px;color:var(--green);font-style:italic}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .grid2 .btn{margin:0;padding:13px 8px;font-size:15px}
  .goal{margin:4px 0 18px;font-size:13px;color:var(--muted)}
  @media (max-width:520px){
    .ftable thead{display:none}
    .ftable,.ftable tbody,.ftable tr,.ftable td{display:block;width:100%}
    .ftable tr{padding:10px 0;border-bottom:1px solid var(--line)}
    .ftable td{border:0;padding:1px 0;width:auto}
    .fnum{font-size:15px;white-space:normal}
    .fname{display:inline;color:var(--muted);font-weight:400}
    .fnum::after{content:" · "}
    .fnum,.fname{display:inline}
    .fuse{display:block;margin-top:3px}
    .fex::before{content:"e.g. "}
    .fex{display:block;margin-top:2px}
  }
  button:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
</style>
</head>
<body>
<header><h1>EA Part 1</h1><button id="navHome">Home</button></header>
<main id="app"></main>

<script>
/* =========================================================
   LESSONS — add or edit here. Each lesson:
   id, title, rules[] (use <b> for highlighted key terms),
   trap, explain (your "say it back" prompt), questions[]
   Questions: q, options[], answer (index), why
   Numbers are 2025 law (tested May 2026 – Feb 2027).
   ========================================================= */
const LESSONS = [
{
  id:"filing-status",
  title:"Filing status & dependents",
  intro:"Everything on the 1040 hangs off two decisions: what status you are, and who you can claim.",
  rules:[
    "Whatever you are on <b>December 31</b> is what you are all year <i>(marital status is determined on the last day of the tax year)</i>. Married on the 31st = MFJ or MFS.",
    "Spouse died? Still <b>MFJ that year</b>. The next 2 years: <b>Qualifying Surviving Spouse</b> if a dependent child lives with you.",
    "<b>Head of Household</b> = not married (or spouse gone the last 6 months) + you pay more than half the home + a dependent lives with you more than half the year. Only exception: a dependent <b>parent</b> can live elsewhere. <i>(Exam words: “qualifying person,” “cost of keeping up a home,” “considered unmarried.”)</i>",
    "<b>Qualifying child</b>: your kid, sibling, or their kids; under 19 (24 if student); lives with you more than half the year; doesn't pay more than half their own support <i>(the relationship, age, residency, support, and joint-return tests)</i>.",
    "<b>Qualifying relative</b>: anyone else you support more than half, with taxable income under <b>$5,200</b> <i>(the “gross income test” and “support test”; also can't be anyone's qualifying child)</i>."
  ],
  trap:"Form 8332 hands the other parent the child tax credit only. HOH, EIC, and the dependent care credit always stay with the parent the child sleeps at most <i>(the custodial parent)</i>.",
  explain:"In one sentence: what's the difference between a qualifying child and a qualifying relative?",
  questions:[
    {q:"Maria's husband died in March 2025. Her 10-year-old son lives with her. What is her filing status for 2025 and for 2026?",
     options:["Single, then Head of Household","MFJ, then Qualifying Surviving Spouse","MFJ, then Head of Household","Qualifying Surviving Spouse both years"],answer:1,
     why:"Year of death is still MFJ. The two following years are Qualifying Surviving Spouse while a dependent child lives with her."},
    {q:"Grandma lives with you all year. Her only income is $6,100 of Social Security. You pay all her expenses. Can you claim her?",
     options:["No, income is over $5,200","Yes, as a qualifying child","Yes, as a qualifying relative","Only if she is under 65"],answer:2,
     why:"The $5,200 test counts taxable gross income. Her Social Security is nontaxable at that level, so she passes. You provide more than half her support."},
    {q:"Mom (custodial) signs Form 8332 to Dad. Which can Dad claim?",
     options:["Child tax credit only","Child tax credit and Head of Household","EIC and Head of Household","Everything, since he has the form"],answer:0,
     why:"8332 moves the dependency and child tax credit. HOH, EIC, and dependent care stay with the custodial parent."},
    {q:"Two unmarried parents live with their child all year. Father AGI $60,000, mother AGI $45,000. Both claim the child. Who wins the tiebreaker?",
     options:["Mother, lower AGI","Father, higher AGI","Whoever files first","They split the credits"],answer:1,
     why:"Both are parents with the same nights, so the higher AGI wins."}
  ]
},
{
  id:"gross-income",
  title:"What counts as income",
  intro:"The default rule is brutal: everything is income unless the Code says it isn't. The exam tests the exceptions.",
  rules:[
    "<b>All income is taxable</b> unless a specific rule excludes it. Cash, property, services, forgiven debt, prizes, gambling, found money.",
    "Big exclusions: <b>gifts and inheritances</b>, <b>life insurance</b> death benefits, <b>municipal bond interest</b>, child support, workers' comp, most damages for physical injury.",
    "<b>Alimony</b>: divorces after 2018 = not income, not deductible. Older divorces = still taxable to the recipient.",
    "<b>Social Security</b>: up to 85% taxable depending on other income <i>(“provisional income” = AGI + tax-exempt interest + ½ benefits)</i>. Never more than 85%.",
    "<b>Cancelled debt</b> <i>(“discharge of indebtedness income”)</i> is income, except when bankrupt, insolvent, or (through 2025) qualified main-home mortgage debt.",
    "<b>Home sale</b>: exclude $250,000 gain ($500,000 MFJ) if you owned and lived there 2 of the last 5 years <i>(the “ownership test” and “use test” for a “principal residence”)</i>."
  ],
  trap:"Punitive damages and interest on a settlement are taxable even when the injury was physical. Emotional-distress damages are taxable unless tied to a physical injury.",
  explain:"Name three things a client might receive that are NOT taxable, and one they'd be surprised IS taxable.",
  questions:[
    {q:"A client wins $2,000 at a casino and loses $3,000 the same year. She takes the standard deduction. Taxable gambling income?",
     options:["$0, losses exceed winnings","$2,000","$2,000 minus $3,000 = -$1,000 loss","$1,000"],answer:1,
     why:"Winnings are income in full. Losses are only an itemized deduction (up to winnings), so with the standard deduction nothing offsets."},
    {q:"Divorce finalized in 2021. Ex pays $12,000 alimony in 2025. Who reports it?",
     options:["Recipient reports income, payer deducts","Neither — not income, not deductible","Payer reports it as income","Recipient reports, payer gets no deduction"],answer:1,
     why:"Post-2018 divorce agreements: alimony is tax-neutral."},
    {q:"Client's $15,000 credit card balance is cancelled. On that date assets were $40,000 and debts were $70,000. Taxable cancelled debt?",
     options:["$15,000","$0","$30,000","$5,000"],answer:1,
     why:"Insolvent by $30,000 before the cancellation, which exceeds the $15,000 forgiven, so the full amount is excluded (Form 982)."},
    {q:"Single client owned and lived in her home 3 of the last 5 years, sells for a $300,000 gain. Taxable gain?",
     options:["$0","$50,000","$300,000","$150,000"],answer:1,
     why:"$250,000 exclusion for single filers; the remaining $50,000 is capital gain."}
  ]
},
{
  id:"adjustments",
  title:"Above-the-line adjustments",
  intro:"Schedule 1 Part II. These reduce income before AGI <i>(“adjustments to income”)</i>, so everyone gets them — no itemizing needed.",
  rules:[
    "The big ones: <b>educator expenses</b> ($300), <b>HSA</b> contributions, <b>half of self-employment tax</b>, <b>SE health insurance</b>, <b>SEP/SIMPLE/solo 401k</b>, <b>traditional IRA</b>, <b>student loan interest</b> ($2,500), early withdrawal penalties.",
    "<b>Student loan interest</b>: max $2,500, phases out with income, not allowed if MFS or claimed as a dependent.",
    "<b>SE health insurance</b>: deductible only up to net SE profit, and not for months you were eligible for an employer plan (yours or spouse's).",
    "<b>Traditional IRA</b>: $7,000 ($8,000 if 50+). Deduction phases out if covered by a workplace plan.",
    "<b>HSA</b> 2025: $4,300 self-only, $8,550 family, +$1,000 if 55+. Must have a high-deductible plan and no other coverage."
  ],
  trap:"Moving expenses are gone for everyone except active-duty military on orders. Unreimbursed employee expenses (Form 2106) only survive for reservists, performing artists, and fee-basis officials.",
  explain:"Why does the IRS let a self-employed person deduct half of their SE tax? Say it like you'd explain it to a client.",
  questions:[
    {q:"Client has $60,000 Schedule C profit and pays $9,000 for family health insurance. Spouse's employer offered coverage all year. SE health insurance deduction?",
     options:["$9,000","$4,500","$0","$9,000 as an itemized deduction only"],answer:2,
     why:"No deduction for any month you were eligible for an employer-subsidized plan, including a spouse's."},
    {q:"MFS client paid $1,800 student loan interest. Deduction?",
     options:["$1,800","$900","$0","$2,500"],answer:2,
     why:"Married filing separately cannot take the student loan interest deduction."},
    {q:"A 57-year-old with self-only HDHP coverage. Max 2025 HSA contribution?",
     options:["$4,300","$5,300","$8,550","$9,550"],answer:1,
     why:"$4,300 self-only plus the $1,000 catch-up at 55+."},
    {q:"Which is NOT an above-the-line adjustment?",
     options:["Educator expenses","Alimony paid on a 2015 divorce","Charitable contributions","Half of self-employment tax"],answer:2,
     why:"Charity is an itemized deduction on Schedule A (plus a small below-the-line amount for non-itemizers starting 2026)."}
  ]
},
{
  id:"deductions",
  title:"Standard vs. itemized",
  intro:"Most clients take the standard deduction. The exam wants you to know exactly when itemizing beats it and the limits inside Schedule A.",
  rules:[
    "2025 standard deduction: <b>$15,750 single / $31,500 MFJ / $23,625 HOH</b>. Extra $2,000 (single) or $1,600 each (married) if 65+ or blind.",
    "New 2025–2028 <b>senior deduction: $6,000</b> per person 65+, on top of the standard deduction, phases out above $75,000 / $150,000 MAGI.",
    "<b>Medical</b>: only the part over <b>7.5% of AGI</b> <i>(the “AGI floor”)</i>.",
    "<b>SALT</b> (state/local taxes): capped at <b>$40,000</b> for 2025, phasing down toward $10,000 above $500,000 MAGI.",
    "<b>Mortgage interest</b>: on up to $750,000 of acquisition debt. Home equity interest only if the loan bought or improved the home.",
    "<b>Charity</b>: cash up to 60% of AGI; noncash over $500 needs Form 8283; over $5,000 needs an appraisal.",
    "<b>Casualty losses</b>: only federally declared disasters."
  ],
  trap:"If one spouse itemizes on an MFS return, the other spouse must itemize too — even if their standard deduction would be bigger.",
  explain:"A client with $9,000 of medical bills and $80,000 AGI asks why 'none of it counted.' Explain the math.",
  questions:[
    {q:"AGI $80,000, medical expenses $9,000. Deductible medical on Schedule A?",
     options:["$9,000","$3,000","$0","$6,000"],answer:1,
     why:"7.5% of $80,000 is $6,000. Only $9,000 − $6,000 = $3,000 is deductible."},
    {q:"Single, age 68, 2025, no other special situations. Total standard deduction before the senior deduction?",
     options:["$15,750","$17,750","$17,350","$21,750"],answer:1,
     why:"$15,750 base plus the $2,000 additional amount for age 65+."},
    {q:"Client donates a used car worth $6,000 to charity. What's required?",
     options:["Nothing beyond a receipt","Form 8283 only","Form 8283 and a qualified appraisal","Form 1098-C only"],answer:2,
     why:"Noncash gifts over $5,000 need Form 8283 Section B and an appraisal (vehicles also get a 1098-C from the charity)."},
    {q:"Client takes out a $100,000 home equity loan and uses it to pay off credit cards. Interest deductible?",
     options:["Yes, fully","Yes, up to $750,000 of debt","No","Only the first $100,000"],answer:2,
     why:"Home equity interest is deductible only when the proceeds buy, build, or substantially improve the home."}
  ]
},
{
  id:"credits",
  title:"Credits",
  intro:"Credits cut tax dollar for dollar. The exam tests amounts, refundability, and who is locked out.",
  rules:[
    "<b>Child tax credit</b> 2025: <b>$2,200</b> per child under 17 with an SSN; up to $1,700 refundable. $500 for other dependents. Phases out at $200,000 / $400,000 MFJ. New for 2025: the <b>taxpayer</b> (at least one spouse if MFJ) must also have an SSN.",
    "<b>EIC</b>: earned income required, investment income under $11,950, valid SSNs, no MFS (unless separated 6+ months), and a child must live with you over half the year.",
    "<b>Dependent care</b> (Form 2441): 20–35% of up to $3,000 (one child) / $6,000 (two+). Both spouses must work or be students.",
    "<b>American Opportunity</b>: $2,500 per student, first 4 years, 40% refundable, half-time enrollment. <b>Lifetime Learning</b>: $2,000 per return, any course, nonrefundable.",
    "<b>Premium tax credit</b> (8962): reconcile the 1095-A. Excess advance payments get paid back.",
    "<b>Saver's credit</b> (8880): 10–50% of up to $2,000 in retirement contributions for lower-income filers."
  ],
  trap:"Refundable credits (EIC, additional CTC, AOTC's 40%, PTC) can produce a refund with zero tax. Nonrefundable ones (LLC, dependent care, saver's) only bring tax to zero — order matters on Schedule 3.",
  explain:"Explain to a client why the American Opportunity Credit is usually better than Lifetime Learning.",
  questions:[
    {q:"Client is MFS, lived with spouse all year, has one qualifying child. Can she claim EIC?",
     options:["Yes","Yes, at half the amount","No","Only if her income is under $30,000"],answer:2,
     why:"MFS blocks EIC unless the spouses lived apart the last 6 months of the year."},
    {q:"Junior is a college sophomore, half-time. Tuition paid $8,000. Max American Opportunity Credit?",
     options:["$2,000","$2,500","$4,000","$8,000"],answer:1,
     why:"100% of the first $2,000 plus 25% of the next $2,000 = $2,500 max."},
    {q:"Client's tax is $600. She qualifies for a $1,200 Lifetime Learning Credit. Refund from the credit?",
     options:["$1,200","$600","$0","$480"],answer:2,
     why:"LLC is nonrefundable. It wipes out the $600 tax; the other $600 is lost."},
    {q:"Which dependent gets the $500 'other dependent' credit instead of the child tax credit?",
     options:["A 12-year-old with an SSN","A 17-year-old","A 10-year-old with an ITIN","Both the 17-year-old and the ITIN child"],answer:3,
     why:"CTC requires under 17 and an SSN. Anyone who misses either test falls to the $500 credit."}
  ]
},
{
  id:"capital-gains",
  title:"Capital gains & basis",
  intro:"Every gain question is the same three steps: find the basis, find the holding period, apply the rate.",
  rules:[
    "<b>Gain = amount realized − adjusted basis</b> <i>(“amount realized” = sale price minus selling costs)</i>. Basis = cost + improvements − depreciation taken.",
    "<b>Holding period</b>: more than one year = long-term. Exactly one year = short-term.",
    "Long-term rates: <b>0%, 15%, 20%</b>. 2025 0% bracket up to $48,350 single / $96,700 MFJ taxable income. Collectibles max 28%; unrecaptured §1250 gain max 25%.",
    "<b>Inherited property</b>: basis = fair market value at death <i>(“stepped-up basis”)</i>, always long-term.",
    "<b>Gifted property</b>: carry over the donor's basis <i>(“carryover basis” or “transferred basis”)</i> (and holding period). If FMV was lower at the gift, use FMV to figure a loss.",
    "<b>Net capital loss</b>: deduct $3,000 per year ($1,500 MFS), carry the rest forward forever.",
    "<b>Wash sale</b>: sell at a loss and rebuy within 30 days either side — loss disallowed, added to new basis."
  ],
  trap:"Losses on personal-use property (your car, your home) are never deductible. Gains on them are taxable.",
  explain:"Explain the difference in basis between property you inherit and property you're given.",
  questions:[
    {q:"Dad bought stock for $10,000. He gives it to Son when it's worth $25,000. Son sells for $30,000. Son's gain?",
     options:["$5,000","$20,000","$30,000","$0"],answer:1,
     why:"Gifts carry over the donor's basis: $30,000 − $10,000 = $20,000."},
    {q:"Same stock, but Dad dies and Son inherits it at $25,000 FMV, then sells for $30,000 two months later. Gain and character?",
     options:["$5,000 short-term","$5,000 long-term","$20,000 long-term","$20,000 short-term"],answer:1,
     why:"Inherited basis steps up to FMV at death, and inherited property is always long-term."},
    {q:"Client has $2,000 short-term gain and $9,000 long-term loss in 2025, MFJ. Effect on this year's return?",
     options:["Deduct $7,000","Deduct $3,000, carry $4,000 forward","Deduct $9,000","Deduct $2,000"],answer:1,
     why:"Net loss is $7,000. $3,000 deductible this year; $4,000 carries forward."},
    {q:"Client sells 100 shares at a $1,500 loss on May 1 and buys 100 shares of the same stock on May 20. Result?",
     options:["$1,500 loss allowed","Loss disallowed, added to new basis","Loss allowed only if long-term","Half the loss allowed"],answer:1,
     why:"Wash sale: repurchase within 30 days. The loss is deferred into the basis of the new shares."}
  ]
},
{
  id:"retirement",
  title:"Retirement accounts",
  intro:"Contributions, distributions, and penalties — mostly Forms 5329 and 8606.",
  rules:[
    "2025 <b>IRA limit $7,000</b> (+$1,000 at 50+). <b>401(k) $23,500</b> (+$7,500 at 50+, +$11,250 at ages 60–63). IRA contributions need earned income.",
    "<b>Roth IRA</b>: no deduction going in, tax-free coming out if the account is 5+ years old and you're 59½ (or disabled, dead, or first-time home buyer up to $10,000).",
    "<b>Early distribution penalty</b> <i>(“additional tax on early distributions”)</i>: 10% before 59½, reported on Form 5329. Exceptions: death, disability, medical over 7.5% AGI, IRS levy, $5,000 birth/adoption, substantially equal payments, and (IRAs only) first home $10,000, education, health insurance while unemployed.",
    "<b>RMDs</b> <i>(required minimum distributions)</i> start at age 73. Missing one costs 25% of the shortfall (10% if fixed quickly).",
    "<b>Form 8606</b> tracks nondeductible traditional IRA contributions and Roth conversions so the basis isn't taxed twice.",
    "<b>Rollovers</b>: 60 days, once per 12 months for IRA-to-IRA. Direct trustee-to-trustee transfers are unlimited."
  ],
  trap:"Leaving a job at 55+ lets you take 401(k) money penalty-free — but that 'age 55 rule' does NOT apply to IRAs. Roll it to an IRA and the exception is gone.",
  explain:"A 45-year-old wants to pull $20,000 from her IRA for a first home. Walk her through the tax and penalty.",
  questions:[
    {q:"A 45-year-old withdraws $20,000 from a traditional IRA to buy a first home. Penalty?",

{
  id:"schedule-c",
  title:"Self-employment: Schedule C & SE",
  intro:"Your daily bread as a preparer, but the exam version is stricter about what's deductible and how SE tax works.",
  rules:[
    "<b>Schedule C</b> = business income minus <b>“ordinary and necessary”</b> expenses <i>(the statutory test for deductibility)</i>. Net profit flows to Schedule 1 and to <b>Schedule SE</b>.",
    "<b>SE tax</b> = 15.3% on 92.35% of net profit (12.4% Social Security up to the $176,100 wage base for 2025, 2.9% Medicare on all). Applies once net profit is <b>$400+</b>.",
    "<b>Half of SE tax</b> is an above-the-line deduction. <b>SE health insurance</b> is too, if no employer plan was available.",
    "<b>Meals</b>: 50% deductible, must be business-related. <b>Entertainment</b>: 0%.",
    "<b>Home office</b> (8829): regular and exclusive use as principal place of business. Simplified method: <b>$5 per sq ft, max 300 sq ft</b>.",
    "<b>Vehicle</b>: standard mileage (70¢ for 2025) or actual expenses. Commuting is never deductible.",
    "<b>Section 179 / bonus depreciation</b>: expense equipment in year one. Form 4562 when placing assets in service.",
    "<b>QBI deduction</b> (Form 8995): 20% of qualified business income, below the line, phases out for high-income service businesses."
  ],
  trap:"A net Schedule C loss can offset wages — but hobby losses can't. If there's no profit motive (profit in 3 of 5 years is the safe harbor), income is taxable and expenses are lost.",
  explain:"Explain to a new Uber driver what self-employment tax is and why it's on top of income tax.",
  questions:[
    {q:"Net Schedule C profit $20,000, no other income. Approximate SE tax?",
     options:["$3,060","$2,826","$1,530","$4,000"],answer:1,
     why:"$20,000 × 92.35% = $18,470 × 15.3% = $2,826. Half ($1,413) is then deductible on Schedule 1."},
    {q:"Dana's home office is 200 sq ft used exclusively for her consulting business. Simplified-method deduction?",
     options:["$1,000","$1,500","$2,000","$500"],answer:0,
     why:"200 sq ft × $5 = $1,000. The cap is 300 sq ft ($1,500)."},
    {q:"A contractor takes a client to a baseball game ($200 tickets) and dinner ($100). Deductible?",
     options:["$300","$150","$50","$250"],answer:2,
     why:"Entertainment is 0% deductible. Business meals are 50%: half of $100 = $50."},
    {q:"Client drives 6,000 business miles, 4,000 commuting miles, 10,000 personal miles in 2025. Standard mileage deduction?",
     options:["$7,000","$4,200","$14,000","$2,800"],answer:1,
     why:"Only business miles count: 6,000 × 70¢ = $4,200. Commuting is personal."}
  ]

{

  rules:[

    "<b>Insolvent</b> = liabilities exceed the fair market value of assets <b>the moment before</b> the cancellation <i>(“immediately before the discharge”)</i>. You exclude only <b>up to the insolvency amount</b>; anything forgiven beyond that is taxable.",
    "Count <b>all</b> assets, including retirement accounts and the house — even if they're protected from creditors.",
    "<b>Price of the exclusion:</b> you must reduce tax attributes (loss carryovers, credits, basis) by the amount excluded. No free lunch.",

  trap:"Foreclosure on a recourse loan is two events: a sale of the house (gain or loss on the property) AND cancelled debt on whatever the lender doesn't recover. Nonrecourse loans are just a sale — no cancelled-debt income.",

  questions:[

     options:["$0","$12,000","$4,000","$8,000"],answer:2,
     why:"Insolvent by $8,000, so $8,000 is excluded on Form 982. The remaining $4,000 is income."},

     why:"Forgiveness by a family member out of love is a gift, not cancelled-debt income. Dad may have a gift tax filing, not her."},
    {q:"Which asset is NOT counted when figuring insolvency?",

{

    "<b>Injured spouse (Form 8379)</b> <i>(“injured spouse allocation”)</i>: the joint <b>refund</b> was grabbed to pay the <b>other spouse's</b> old debt — back child support, defaulted student loans, prior-year tax. You want <b>your share of the refund</b> back. Nothing was wrong with the return.",
    "File 8379 <b>with</b> the return, or afterward by itself. You must have reported income or made payments on the joint return.",
    "<b>Innocent spouse (Form 8857)</b> <i>(“relief from joint and several liability”)</i>: the joint return itself was <b>wrong</b> because of the other spouse (hidden income, fake deductions), and you want out of the <b>tax, interest, and penalties</b>.",
    "Three flavors of relief: <b>innocent spouse</b> (didn't know and had no reason to know) · <b>separation of liability</b> (divorced, widowed, or separated 12+ months — split the tax) · <b>equitable relief</b> (everything else, including unpaid tax you knew about).",
    "File 8857 within <b>2 years</b> of the IRS first trying to collect from you (equitable relief has a longer window).",
    "Joint return = <b>joint and several liability</b>. Each spouse owes 100% until relief is granted. Divorce decrees don't bind the IRS."
  ],
  trap:"'Injured' = your refund was injured. 'Innocent' = you're innocent of the error. If the return was correct, it's never innocent spouse.",
  explain:"Two clients: one's refund was taken for her husband's child support; the other's ex-husband hid $80,000 of income. Which form for each, and why?",
  questions:[
    {q:"Joint refund of $4,000 was offset for the husband's pre-marriage student loan default. Wife earned 60% of the income. What does she file?",
     options:["Form 8857 for innocent spouse relief","Form 8379 for injured spouse allocation","An amended return as MFS","Nothing — joint refunds are joint"],answer:1,
     why:"The return was correct; the refund was taken for his separate debt. Injured spouse gets her portion back."},
    {q:"Ex-husband omitted $50,000 of consulting income on a joint return without the wife's knowledge. The IRS now bills her. Best form?",
     options:["8379","8857","1040-X","2848"],answer:1,
     why:"The return was wrong because of him and she didn't know. Innocent spouse relief on Form 8857."},
    {q:"Which statement is true after a divorce decree says the husband must pay all the joint tax?",
     options:["The IRS can only collect from the husband","The IRS can still collect from either spouse","The wife is automatically an innocent spouse","The debt is split 50/50"],answer:1,
     why:"Joint and several liability. A divorce decree binds the spouses, not the IRS."},
    {q:"Deadline to request traditional innocent spouse relief?",
     options:["3 years from filing","2 years from the IRS's first collection attempt against you","6 years from the due date","No deadline"],answer:1,
     why:"Two years from the first collection activity directed at the requesting spouse."}
  ]
},
{
  id:"amended-returns",
  title:"Amended returns, extensions & refund deadlines",
  intro:"Procedural questions are easy points if you know the clocks. The exam tests the dates more than the math.",
  rules:[
    "<b>Form 1040-X</b> fixes a filed return. Must show the original, the change, and the corrected figures, with an explanation. Can be e-filed for recent years.",
    "<b>Refund deadline:</b> the later of <b>3 years from when the original was filed</b> (early returns count as filed April 15) or <b>2 years from when the tax was paid</b>.",
    "<b>Don't amend</b> for math errors or a missing form the IRS asked for — the IRS fixes those. Do amend for wrong income, status, dependents, deductions, or credits.",
    "<b>Extension (4868):</b> automatic 6 months to file, to <b>October 15</b>. Pay what you expect to owe by April 15 or the failure-to-pay penalty and interest run anyway.",
    "<b>Taxpayers abroad</b> get an automatic 2-month extension to June 15 (Form 2350 for the foreign earned income exclusion). <b>Military in a combat zone:</b> 180 days after leaving the zone.",
    "<b>Superseding return:</b> a corrected return filed <b>before</b> the due date replaces the original entirely — useful to switch MFJ/MFS. After the due date, you can go MFS→MFJ but <b>not</b> MFJ→MFS.",
    "<b>IRS clock to assess:</b> 3 years · 6 years if 25%+ of income omitted · forever for fraud or no return."
  ],
  trap:"A return filed early is treated as filed on the due date, so the 3-year refund clock starts April 15 — not the February day the client filed.",
  explain:"A client filed her 2022 return on February 10, 2023. Today she found a missed $2,000 credit. Explain the deadline and why it isn't February 10, 2026.",
  questions:[
    {q:"Client filed 2022 return on February 10, 2023. Last day to file a 1040-X for a refund?",
     options:["February 10, 2026","April 15, 2026","April 15, 2025","October 15, 2026"],answer:1,
     why:"Early returns are deemed filed on the due date, April 15, 2023. Three years later is April 15, 2026."},
    {q:"A married couple filed MFS on April 1. On May 20 they realize MFJ would save $3,000. Can they change?",
     options:["No — the choice is locked after filing","Yes — file a 1040-X electing MFJ","Only by filing a superseding return","Only if both spouses have the same AGI"],answer:1,
     why:"MFS to MFJ is allowed within 3 years by amending. The reverse (MFJ to MFS) is not allowed after the due date."},
    {q:"Client files Form 4868 on April 15 and pays nothing, expecting to owe $5,000. What happens?",
     options:["No penalties until October 15","Failure-to-pay penalty and interest start April 15; no failure-to-file penalty if filed by October 15","The extension is void","A 5% per month failure-to-file penalty applies"],answer:1,
     why:"Extensions extend filing, not paying. Interest and the 0.5%/month failure-to-pay run from April 15."},
    {q:"The IRS sends a notice saying the client added two lines wrong and owes $200 more. Should you amend?",
     options:["Yes, file a 1040-X immediately","No — the IRS corrects math errors; respond to the notice","Yes, and switch to MFS","Only if the client disagrees"],answer:1,
     why:"Math errors are corrected by the IRS. A 1040-X is for substantive changes."}
  ]

{
  id:"itemized-deep",
  title:"Itemized deductions: the details",
  intro:"You know Schedule A. The exam goes one layer deeper: what counts, what's capped, and what paperwork is required.",
  rules:[
    "<b>Medical</b>: includes premiums you paid after-tax, long-term care premiums (age-based cap), mileage to appointments (21¢ for 2025), and costs for dependents. Not cosmetic surgery, not gym memberships, not over-the-counter items without a prescription.",
    "<b>Taxes</b>: state income OR sales tax (pick one), real estate tax, personal property tax based on value. Not federal tax, not HOA dues, not assessments for improvements. Cap: $40,000 (2025).",
    "<b>Mortgage interest</b>: acquisition debt up to $750,000 (post-2017 loans). <b>Points</b> on a purchase are deductible in full that year; points on a <b>refinance</b> spread over the loan term. PMI is not deductible.",
    "<b>Charity — cash</b>: need a bank record or receipt; $250+ needs a written acknowledgment dated before you file. Limit 60% of AGI.",
    "<b>Charity — property</b>: fair market value for appreciated long-term property (30% of AGI limit). Clothing and household goods must be in good used condition. Over $500 → Form 8283. Over $5,000 → appraisal. Cars → 1098-C, deduction limited to what the charity sold it for.",
    "<b>Not charity</b>: raffle tickets, tuition, political donations, the value of your time, gifts to individuals or GoFundMe pages.",
    "<b>Gambling losses</b> are an itemized deduction, capped at winnings. <b>Investment interest</b> (Form 4952) is capped at net investment income."
  ],
  trap:"A $300 check to church with no written acknowledgment = no deduction, even with the cancelled check. The $250 acknowledgment rule has no exceptions.",
  explain:"Explain to a client why her $2,000 of PMI and her $500 of raffle tickets from the church gala don't show up on Schedule A.",
  questions:[
    {q:"Client pays $6,000 in points to buy a home and $3,000 in points to refinance a different loan (30-year term). Deductible points this year?",
     options:["$9,000","$6,000","$6,100","$3,000"],answer:2,
     why:"Purchase points deduct in full ($6,000). Refinance points spread over 30 years: $3,000 ÷ 30 = $100 this year."},
    {q:"Client donates stock held 3 years, bought for $2,000, now worth $10,000. Deduction?",
     options:["$2,000","$10,000","$8,000","$10,000 minus capital gains tax"],answer:1,
     why:"Long-term appreciated property is deducted at fair market value, and the gain is never taxed. Subject to the 30% of AGI limit."},
    {q:"Which is deductible as a tax on Schedule A?",
     options:["Federal income tax","HOA dues","Vehicle registration fee based on the car's value","Special assessment for new sidewalks"],answer:2,
     why:"A value-based registration fee is a personal property tax. The others aren't deductible taxes."},
    {q:"Client gave $400 cash to a qualified charity and has only a cancelled check. Deduction?",
     options:["$400","$250","$0","$150"],answer:2,
     why:"Any single gift of $250 or more needs a contemporaneous written acknowledgment from the charity. Without it, nothing."}
  ]
},
{
  id:"education",
  title:"Education credits, 529s & student loans",
  intro:"Four different tax breaks for one tuition bill. The exam wants you to pick the right one and avoid double-dipping.",
  rules:[
    "<b>American Opportunity Credit</b>: $2,500 max (100% of first $2,000 + 25% of next $2,000), first 4 years of college, at least half-time, no felony drug conviction. <b>40% refundable</b>. Phases out $80,000–$90,000 single / $160,000–$180,000 MFJ. Needs the school's EIN and a 1098-T.",
    "<b>Lifetime Learning Credit</b>: 20% of up to $10,000 = <b>$2,000 per return</b>, any level, any number of courses, unlimited years, nonrefundable. Same phase-out.",
    "<b>Qualified expenses</b>: tuition, fees, required books/supplies (AOTC only for books bought anywhere). <b>Not</b> room and board, insurance, transportation, sports.",
    "<b>Who claims:</b> whoever claims the student as a dependent. If parents can claim but don't, the student can claim the credit — but only the nonrefundable part.",
    "<b>529 plans</b> (1099-Q): earnings tax-free if used for qualified education, which here <b>does</b> include room and board, up to $10,000 K-12 tuition, and $10,000 lifetime of student loan payoff. Nonqualified: earnings taxed + 10% penalty.",
    "<b>No double-dipping:</b> the same dollar of tuition can't support both a credit and a tax-free 529 withdrawal. Scholarships reduce qualified expenses.",
    "<b>Student loan interest</b>: up to $2,500 above the line, phases out $85,000–$100,000 single / $170,000–$200,000 MFJ, not for MFS or dependents."
  ],
  trap:"AOTC is per student; LLC is per return. Two kids in college can each get $2,500 AOTC, but the whole family shares one $2,000 LLC.",
  explain:"Parents have a freshman and a grad student. Explain which credit fits each and why they can't use AOTC for both.",
  questions:[
    {q:"Parents pay $3,000 tuition for their sophomore (half-time). MFJ, AGI $150,000. Max AOTC?",
     options:["$2,000","$2,250","$2,500","$3,000"],answer:1,
     why:"100% of first $2,000 + 25% of the next $1,000 = $2,250. Under the phase-out."},
    {q:"Which expense qualifies for the AOTC?",
     options:["Dorm room","Meal plan","Required textbook bought on Amazon","Parking permit"],answer:2,
     why:"Books and supplies required for the course count for AOTC even if not bought from the school. Room, board, and transportation never qualify for credits."},
    {q:"Client withdraws $20,000 from a 529: $12,000 for tuition, $8,000 for rent near campus while enrolled half-time. Taxable?",
     options:["$8,000 of earnings taxable","$0 — room and board qualify for 529 purposes","$20,000 taxable","Earnings on $8,000 taxable plus 10% penalty"],answer:1,
     why:"Room and board (up to the school's cost of attendance) are qualified 529 expenses, unlike for the credits."},
    {q:"Student's parents can claim her as a dependent but choose not to. She paid $4,000 tuition and owes $300 in tax. Her AOTC?",
     options:["$2,500 including $1,000 refundable","$300 only","$0 — only parents can claim it","$1,000"],answer:1,
     why:"A student who could be claimed as a dependent gets only the nonrefundable portion, limited to her $300 tax."}
  ]
},
{
  id:"premium-credit",
  title:"Premium tax credit & the 1095-A",
  intro:"Anyone with Marketplace insurance must reconcile. Miss it and the IRS holds the refund. The exam asks how the reconciliation works.",
  rules:[
    "<b>Who qualifies:</b> bought coverage through the <b>Marketplace</b> (healthcare.gov or state exchange), household income at least 100% of the federal poverty line (no upper cap through 2025), not eligible for affordable employer coverage or Medicaid/Medicare, and not MFS (except abuse/abandonment).",
    "<b>Advance payments</b> go straight to the insurer during the year, based on estimated income. <b>Form 1095-A</b> shows premiums, the benchmark (SLCSP) premium, and the advance credit by month.",
    "<b>Form 8962</b> figures the real credit on actual income. Got too much advance? Repay it (Schedule 2). Got too little? Extra refundable credit (Schedule 3).",
    "<b>Repayment caps</b> for income under 400% of poverty: $375 to $3,250 depending on income and filing status (2025). Over 400%: repay it all.",
    "<b>Household income</b> = MAGI of taxpayer + spouse + dependents who must file. MAGI adds back tax-free Social Security, foreign income, and tax-exempt interest.",
    "<b>Shared policy</b> (divorce, kid on a parent's plan): allocate the 1095-A between returns by agreement or by number of covered people.",
    "A dependent who received advance credit must be on the return that claims them — or the credit is repaid."
  ],
  trap:"Client 'forgot' about the 1095-A and files without Form 8962 = IRS rejects or freezes the return. Always ask every client if they had Marketplace coverage.",
  explain:"A client's income came in $15,000 higher than she estimated when she signed up. Explain what happens at tax time.",
  questions:[
    {q:"Client received $6,000 of advance premium credit. On Form 8962 the actual credit is $4,000. Household income is 550% of poverty. Result?",
     options:["Repay $2,000","Repay nothing — capped","Repay $6,000","Extra $2,000 credit"],answer:0,
     why:"Above 400% of poverty there's no repayment cap; the full $2,000 excess is repaid on Schedule 2."},
    {q:"Which filing status generally blocks the premium tax credit?",
     options:["Single","Head of Household","Married Filing Separately","Qualifying Surviving Spouse"],answer:2,
     why:"MFS filers can't claim the PTC unless they qualify for the domestic abuse or abandonment exception."},
    {q:"Which form reports the credit and reconciliation?",
     options:["1095-A","8962","8965","1095-B"],answer:1,
     why:"The 1095-A is the information statement; Form 8962 is the reconciliation attached to the 1040."},
    {q:"Client's employer offered affordable family coverage all year, but he bought a Marketplace plan with an advance credit instead. At filing?",
     options:["Keeps the credit","Must repay the advance credit — not eligible","Credit reduced by half","Keeps the credit if the employer plan was worse"],answer:1,
     why:"Eligibility for affordable employer coverage disqualifies him for those months; the advance payments are repaid."}
  ]
},
{
  id:"foreign",
  title:"Foreign income, FBAR & foreign accounts",
  intro:"U.S. citizens and residents are taxed on worldwide income. The exam tests the two ways to avoid double tax and the two account reports.",
  rules:[
    "<b>Worldwide income</b> — wages in Germany, rent in Kosovo, interest in a Canadian bank — all go on the 1040.",
    "<b>Foreign earned income exclusion</b> (Form 2555): exclude up to <b>$130,000</b> (2025) of <b>earned</b> income if you pass the <b>bona fide residence</b> test (full tax year abroad) or the <b>physical presence</b> test (330 full days in any 12 months). Plus a housing exclusion. Not for pensions, interest, or U.S. government pay.",
    "<b>Foreign tax credit</b> (Form 1116): dollar-for-dollar credit for foreign <b>income</b> taxes, limited to the U.S. tax on that foreign income. Can't take the credit on income you excluded with 2555. Under $300 ($600 MFJ) of foreign tax on passive income → skip the 1116.",
    "<b>Credit vs. deduction:</b> the credit is almost always better; the deduction is only on Schedule A.",
    "<b>FBAR</b> (FinCEN 114): foreign accounts with a combined value over <b>$10,000</b> at any moment in the year. Filed online with FinCEN — <b>not</b> with the tax return. Due April 15, automatic extension to October 15. Penalties are brutal.",
    "<b>Form 8938</b> (FATCA): filed <b>with</b> the 1040 when foreign financial assets exceed $50,000 at year-end or $75,000 anytime (single, living in U.S.; higher for MFJ and expats). Both FBAR and 8938 may be required.",
    "Foreign <b>gifts/inheritances</b> over $100,000 from an individual → Form 3520 (informational, not taxable)."
  ],
  trap:"The FBAR $10,000 test is the total of all accounts combined at their highest point. Three accounts with $4,000 each = must file.",
  explain:"A client who moved back from Kosovo in March had a bank account there with $12,000 in it and earned $20,000 there. What forms does she need and why?",
  questions:[
    {q:"U.S. citizen worked in Qatar all of 2025 earning $150,000, meets the bona fide residence test. Amount excluded with Form 2555 (ignoring housing)?",
     options:["$150,000","$130,000","$0 — Qatar has no income tax","$120,000"],answer:1,
     why:"The 2025 exclusion is $130,000; the other $20,000 is taxable (at the rate that applies as if the excluded amount were still income)."},
    {q:"Client has three foreign accounts: $4,500, $3,000, and $3,000 at their highest points. FBAR required?",
     options:["No — each is under $10,000","Yes — combined they exceed $10,000","Only if interest was earned","Only if the accounts are in the same country"],answer:1,
     why:"Aggregate value over $10,000 at any time triggers the FBAR."},
    {q:"Where is the FBAR filed?",
     options:["Attached to Form 1040","With FinCEN electronically, separate from the return","With Form 8938","Mailed to the IRS service center"],answer:1,
     why:"FinCEN 114 is filed online through the BSA E-Filing system, not with the tax return."},
    {q:"Client paid $2,000 of Canadian income tax on $10,000 of Canadian dividends. The U.S. tax on that income is $1,500. Foreign tax credit?",
     options:["$2,000","$1,500","$500","$0"],answer:1,
     why:"The credit is limited to the U.S. tax on the foreign income. The unused $500 carries back 1 year or forward 10."}
  ]
},
{
  id:"gift-estate",
  title:"Gift tax & estate basics",
  intro:"Part 1 doesn't go deep here, but it does expect the thresholds, who files, and how it connects to basis.",
  rules:[
    "<b>Annual exclusion</b> 2025: <b>$19,000</b> per recipient per year. Married couples can <b>split</b> gifts: $38,000 per recipient (both must consent on Form 709).",
    "<b>Form 709</b> is filed by the <b>giver</b> when gifts to one person exceed $19,000. Tax is rarely owed — the excess just eats into the <b>lifetime exemption of $13.99 million</b> (2025).",
    "<b>Never a gift</b>: tuition paid <b>directly</b> to the school, medical bills paid <b>directly</b> to the provider, gifts to a spouse (U.S. citizen), gifts to charity, political contributions.",
    "The <b>recipient</b> pays no income tax on a gift, ever. They take the giver's <b>basis</b> (carryover) — so gifted stock keeps the old cost.",
    "<b>Form 706</b> (estate tax) is only for estates over $13.99 million — but consider filing anyway for <b>portability</b>, which lets the surviving spouse use the dead spouse's unused exemption.",
    "<b>Inherited property</b> gets a <b>stepped-up basis</b> to fair market value at death. No income tax to the heir on the inheritance itself.",
    "<b>Form 1041</b> is the <b>income</b> tax return for an estate or trust that earns $600+ after death. Beneficiaries get a K-1."
  ],
  trap:"Paying your grandchild's $30,000 tuition directly to the university is not a gift. Handing the grandchild $30,000 to pay it themselves is an $11,000 taxable gift.",
  explain:"A client wants to give each of his 3 kids $40,000 this year and asks if he'll owe tax. Explain.",
  questions:[
    {q:"Client gives his daughter $50,000 in 2025. Gift tax owed?",
     options:["Tax on $50,000","Tax on $31,000","None — files Form 709 and uses $31,000 of lifetime exemption","None — gifts to children are exempt"],answer:2,
     why:"$50,000 − $19,000 exclusion = $31,000 reported on Form 709, reducing the $13.99M lifetime exemption. No tax actually due."},
    {q:"Married couple wants to give their son the maximum with no Form 709. Amount?",
     options:["$19,000","$38,000 — but splitting a single check still requires a 709","$38,000 if each spouse gives $19,000 from their own funds","$13.99 million"],answer:2,
     why:"Each spouse has a $19,000 exclusion. Separate gifts avoid the form; gift-splitting one spouse's $38,000 check requires filing to elect it."},
    {q:"Grandma pays $25,000 directly to State University for her grandson's tuition and gives him $10,000 cash. Taxable gift?",
     options:["$35,000","$16,000","$0","$25,000"],answer:2,
     why:"Direct tuition payments are excluded entirely. The $10,000 cash is under the $19,000 annual exclusion."},
    {q:"Who files Form 709?",
     options:["The person who receives the gift","The person who gives the gift","Both","The estate executor"],answer:1,
     why:"The donor files and is liable for any gift tax. The recipient reports nothing."}
  ]
},
{
  id:"due-diligence",
  title:"Preparer due diligence, records & advising",
  intro:"This is the 'Advising the taxpayer' domain. It's about you, not the client — what you must ask, keep, and warn about.",
  rules:[
    "<b>Form 8867</b> is required on any return claiming <b>EIC, CTC/ACTC/ODC, AOTC, or head of household</b>. Penalty: <b>$650 per credit</b> (returns filed in 2026) for each failure — a return with all four can cost $2,600.",
    "Due diligence has four parts: complete the 8867 · compute the credits on worksheets · <b>ask questions</b> when information seems wrong or incomplete, and document the answers · <b>keep records</b> for <b>3 years</b>.",
    "You must ask enough to know the facts: a 22-year-old with three kids and $50,000 of Schedule C income with no expenses should prompt questions, and the questions and answers go in your file.",
    "<b>Recordkeeping for clients:</b> keep return support at least <b>3 years</b> (6 if income might be understated), property records until 3 years after the sale, employment tax records 4 years.",
    "<b>Identity theft:</b> Form 14039 to report; an <b>IP PIN</b> from the IRS is required on returns once issued and can be requested voluntarily.",
    "<b>Advising:</b> explain refund timing (EIC/ACTC refunds held until mid-February), estimated payments for clients with new self-employment or rental income, and withholding checkups after life changes (marriage, second job).",
    "<b>Refund offsets:</b> the Treasury Offset Program takes refunds for back taxes, child support, federal student loans, and state debts. Warn clients so they aren't surprised."
  ],
  trap:"A signed statement from the client saying 'everything I told you is true' does not satisfy due diligence. You need to have asked the right questions and written down the answers.",
  explain:"A new client says she's head of household with two nephews she supports. What do you need to ask and record before filing?",
  questions:[
    {q:"A preparer files a return claiming EIC, CTC, and HOH without completing Form 8867. Maximum penalty for that return?",
     options:["$650","$1,300","$1,950","$2,600"],answer:2,
     why:"$650 per failure × 3 credits/status = $1,950."},
    {q:"How long must a preparer keep due diligence records?",
     options:["1 year","3 years","6 years","7 years"],answer:1,
     why:"Three years from the latest of the due date, the filing date, or when presented to the client for signature."},
    {q:"Client says she's self-employed cleaning houses, earned $18,000, had no expenses, and has three qualifying kids. Best action?",
     options:["Prepare the return as stated — the client is responsible","Ask about supplies, mileage, and how income was tracked; document the answers","Refuse the return","Reduce the income to be safe"],answer:1,
     why:"Information that seems incomplete requires additional inquiries, and the questions and answers must be documented."},
    {q:"Which form does a taxpayer use to report identity theft to the IRS?",
     options:["8862","14039","8867","4506"],answer:1,
     why:"Form 14039, Identity Theft Affidavit."}
  ]
},
{
  id:"alimony-divorce",
  title:"Alimony, child support & divorce property",
  intro:"Divorce touches filing status, dependents, alimony, property splits, and retirement accounts. The exam likes to mix them in one scenario.",
  rules:[
    "<b>Alimony</b> under agreements executed <b>after 2018</b>: <b>not deductible</b> by the payer, <b>not income</b> to the recipient. Pre-2019 agreements keep the old rule (deductible/taxable) unless modified to adopt the new one.",
    "<b>Child support</b> is never deductible and never income — under any agreement, any year.",
    "If a payment is partly alimony and partly child support and the payer falls short, the shortfall is treated as <b>child support first</b>.",
    "<b>Property transfers</b> between spouses or incident to divorce: no gain, no loss. The recipient takes the <b>carryover basis</b>. Getting the house with a low basis is worse than it looks.",
    "<b>Retirement accounts:</b> a <b>QDRO</b> splits a 401(k) with no tax or penalty; the receiving spouse is taxed on withdrawals. IRAs are split by transfer 'incident to divorce' with no tax.",
    "<b>Filing status</b> is set on December 31. Divorced by then = single or HOH. Still married = MFJ/MFS, or HOH if 'considered unmarried' (spouse gone the last 6 months + qualifying child).",
    "<b>Dependents:</b> custodial parent (more nights) claims the child. Form 8332 releases the CTC to the noncustodial parent, never HOH, EIC, or dependent care."
  ],
  trap:"In a divorce, the house is a trap: a $400,000 house with a $100,000 basis has $300,000 of built-in gain, and the spouse who keeps it inherits all of it (though they may still get the $250,000 exclusion).",
  explain:"A client divorced in 2024 gets $1,500 a month: $1,000 alimony, $500 child support. Her ex only paid $9,000 this year. Explain what she reports.",
  questions:[
    {q:"Divorce decree signed in 2020 requires $2,000/month alimony. Recipient's taxable alimony for 2025?",
     options:["$24,000","$0","$12,000","$24,000 minus child support"],answer:1,
     why:"Post-2018 agreements: alimony is neither deductible nor taxable."},
    {q:"Under a 2016 decree, husband owes $1,000/month alimony and $500/month child support but paid only $12,000 total this year. Taxable alimony to the wife?",
     options:["$12,000","$6,000","$8,000","$0"],answer:1,
     why:"Shortfalls go to child support first: $6,000 of child support is satisfied, leaving $6,000 of taxable alimony under the pre-2019 rules."},
    {q:"In a divorce, wife receives stock the husband bought for $10,000, now worth $50,000. Her basis?",
     options:["$50,000","$10,000","$30,000","$0"],answer:1,

/* ===================== NUMBER-SWAPPING VARIANTS =====================
   vary(id, i) returns a fresh version of built-in question i of lesson id.
   Add more by copying a block. m() formats money. pick() picks randomly. */
const m=n=>"$"+Math.round(n).toLocaleString();
const rnd=(a,b,step=1)=>a+step*Math.floor(Math.random()*((b-a)/step+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function opts(correct,wrongs){
  const seen=new Set([correct]);const w=[];
  for(const x of wrongs){if(!seen.has(x)){seen.add(x);w.push(x)}if(w.length===3)break}
  const base=parseFloat(String(correct).replace(/[^0-9.]/g,""))||1000;
  for(const f of [1.5,0.5,2,0.75,1.25,3,0.25]){if(w.length===3)break;const c=m(base*f);if(!seen.has(c)){seen.add(c);w.push(c)}}
  const all=shuffle([correct,...w]);return{options:all,answer:all.indexOf(correct)}
}

/* Cards: lesson questions keyed "lessonId#i", generated keyed "g#n" */
function cardKey(it){return it.l?it.l.id+"#"+it.i:it.f?"f#"+it.i:"g#"+it.i}
function allItems(){
  const out=[];
  LESSONS.forEach(l=>l.questions.forEach((q,i)=>out.push({l,q,i,title:l.title})));
  S.gen.forEach((q,i)=>out.push({q,i,title:q.topic,gen:true}));
  FORMS.forEach((f,i)=>out.push({q:formQuestion(i),i:f[0],f:true,title:"Forms & schedules"}));
  return out;
}
function formQuestion(i){
  const f=FORMS[i],others=shuffle(FORMS.filter((x,j)=>j!==i)).slice(0,3);
  if(Math.random()<0.5){
    const opts=shuffle([f,...others]);
    return{q:"A client needs to: "+f[2].replace(/\.$/,"")+". Which form or schedule?",options:opts.map(o=>o[0]),answer:opts.indexOf(f),why:f[0]+" — "+f[1]+". "+f[2]};
  }
  const opts=shuffle([f,...others]);
  return{q:"What is "+(f[0].startsWith("Schedule")||f[0].startsWith("FinCEN")?"":"Form ")+f[0]+" used for?",options:opts.map(o=>o[2]),answer:opts.indexOf(f),why:f[0]+" — "+f[1]+". "+f[2]};
}
function dueCards(){const t=today();return allItems().filter(it=>{const c=S.cards[cardKey(it)];return c&&c.due<=t})}
function schedule(it,correct,conf=0){
  const k=cardKey(it),c=S.cards[k]||{lvl:0};
  if(!correct)c.lvl=0;                      // wrong: back to tomorrow
  else if(conf===2)c.lvl=0;                 // right but guessing: also tomorrow
  else if(conf===1)c.lvl=Math.min(c.lvl,1); // right, unsure: at most 3 days
  else c.lvl=Math.min(c.lvl+1,INTERVALS.length-1);
  c.due=today()+INTERVALS[c.lvl];c.seen=(c.seen||0)+1;c.miss=(c.miss||0)+(correct?0:1);
  S.cards[k]=c;
  S.days=S.days||{};S.days[today()]=(S.days[today()]||0)+1;save();
}

function topicStats(){

  allItems().forEach(it=>{const c=S.cards[cardKey(it)];if(!c||!c.seen)return;const t=it.title;m[t]=m[t]||{seen:0,miss:0,items:[]};m[t].seen+=c.seen;m[t].miss+=c.miss||0;m[t].items.push(it)});
  return Object.entries(m).map(([t,v])=>({t,...v,rate:v.miss/v.seen})).sort((a,b)=>b.rate-a.rate);
}

function runMock(items){
  const secs=Math.round(items.length*126);const end=Date.now()+secs*1000;
  const picks=new Array(items.length).fill(null);let idx=0,timer;
  function fmt(ms){const s=Math.max(0,Math.floor(ms/1000));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
  function show(){
    const it=items[idx],q=it.q;
    app.innerHTML=`<div class="progress"><i style="width:${(idx+1)/items.length*100}%"></i></div>
      <div class="tag" style="display:flex;justify-content:space-between"><span>Question ${idx+1} of ${items.length}</span><span id="clock"></span></div>
      <p class="q">${esc(q.q)}</p>
      ${q.options.map((o,i)=>`<button class="opt${picks[idx]===i?" correct":""}" data-i="${i}">${esc(o)}</button>`).join("")}
      <div style="display:flex;gap:10px;margin-top:16px">
        <button class="btn ghost" id="prev" ${idx===0?"disabled":""}>Back</button>
        <button class="btn primary" id="nxt">${idx+1<items.length?"Next":"Finish"}</button>
      </div>
      <p class="sub" style="margin-top:14px">${picks.filter(p=>p!==null).length} answered</p>`;
    window.scrollTo(0,0);
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{picks[idx]=+b.dataset.i;app.querySelectorAll(".opt").forEach(x=>x.classList.remove("correct"));b.classList.add("correct")});
    $("prev").onclick=()=>{idx--;show()};
    $("nxt").onclick=()=>{if(idx+1<items.length){idx++;show()}else if(picks.includes(null)&&!confirm("Some questions are unanswered. Finish anyway?"))return;else finish()};
    tick();
  }
  function tick(){const c=$("clock");if(c)c.textContent=fmt(end-Date.now());if(Date.now()>=end){finish()}}
  timer=setInterval(tick,1000);
  function finish(){
    clearInterval(timer);
    let score=0;const misses=[];
    items.forEach((it,i)=>{const ok=picks[i]===it.q.answer;if(ok)score++;else misses.push({it,pick:picks[i]});schedule(it,ok)});
    S.mocks=S.mocks||[];S.mocks.push({date:Date.now(),score,total:items.length});save();
    const pct=Math.round(score/items.length*100);
    app.innerHTML=`<h2>Mock result</h2><div class="score">${pct}%</div>
      <p class="sub">${score} of ${items.length}. ${pct>=85?"Exam-ready pace. Keep the reviews going.":pct>=70?"Close. Drill the misses below and your weak spots.":"Below the passing zone. Focus on lessons and weak-spot drills before the next mock."}</p>
      ${misses.length?`<div class="section-title">Missed (${misses.length})</div>`+misses.map(m=>`<div class="home-card"><p style="color:var(--ink);font-family:var(--serif);font-size:16px;margin-bottom:8px">${esc(m.it.q.q)}</p><p style="color:var(--red)">You: ${m.pick===null?"skipped":esc(m.it.q.options[m.pick])}</p><p style="color:var(--green)">Answer: ${esc(m.it.q.options[m.it.q.answer])}</p><p style="margin-top:8px">${esc(m.it.q.why)}</p></div>`).join(""):""}
      <button class="btn primary" id="done" style="margin-top:16px">Done</button>`;
    $("done").onclick=home;
  }
  show();
}

async function callClaude(topic,n,lvl){
  const sys=`You write practice questions for the IRS Enrolled Agent exam, Part 1 (Individuals), using 2025 federal tax law. Return ONLY a JSON array, no markdown, no preamble. Each element: {"q":"...","options":["...","...","...","..."],"answer":<index 0-3>,"why":"..."}. Rules: realistic client scenarios with names and numbers; four plausible options; exactly one correct; shuffle where the correct answer sits; the "why" must explain the rule the way you'd teach a high-school beginner — plain words, short sentences, name the form or schedule involved, and say why each wrong answer is wrong in one clause. Never repeat a scenario. Vary the taxpayer's situation, filing status and numbers.`;
  const user=`Topic: ${topic}. Difficulty: ${lvl}. Write ${n} questions.`;
  const text=(await askClaude({system:sys+(S.genIRS?" Before writing, search irs.gov to confirm the 2025 rules and dollar amounts for this topic, and base every question on what you find. After any searching, output only the JSON array.":""),user,max_tokens:4000,tools:S.genIRS?[IRS_TOOL]:undefined})).replace(/```json|```/g,"").trim();
  const arr=JSON.parse(text.slice(text.indexOf("["),text.lastIndexOf("]")+1));
  const ok=arr.filter(q=>q&&q.q&&Array.isArray(q.options)&&q.options.length===4&&Number.isInteger(q.answer)&&q.why);
  if(!ok.length)throw new Error("The model returned nothing usable. Try again.");
  return ok;
}

/* ---- Pre-test, then lesson ---- */
function lesson(l){
  if(S.done[l.id]||l.questions.length<3)return lessonBody(l);
  const items=shuffle(l.questions.map((q,i)=>({l,q,i,title:l.title}))).slice(0,3);
  app.innerHTML=`<div class="tag">Before the lesson</div><h2>Try first</h2>
    <p class="q">Three questions on "${l.title}" before you've read a word. Getting them wrong is fine — trying first is what makes the lesson stick.</p>
    <button class="btn primary" id="go">Try 3 questions</button><button class="btn ghost" id="skip">Skip to lesson</button>`;
  $("go").onclick=()=>runQuiz(items.map(x=>({...x,pretest:true})),()=>lessonBody(l));
  $("skip").onclick=()=>lessonBody(l);
}
function lessonBody(l){
  app.innerHTML=`<div class="lesson">
    <div class="tag">Lesson ${LESSONS.indexOf(l)+1} of ${LESSONS.length}</div>
    <h2>${l.title}</h2>
    <p>${l.intro}</p>
    <div class="section-title">The rules</div>
    ${l.rules.map(r=>`<p class="rule">${r}</p>`).join("")}
    ${VISUALS[l.id]?`<div class="section-title">Picture it</div><div style="background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:14px">${VISUALS[l.id]}</div>`:""}
    <div class="trap"><span>Exam trap</span>${l.trap}</div>
    <button class="btn primary" id="next">I've got it — say it back</button>
  </div>`;
  window.scrollTo(0,0);
  $("next").onclick=()=>explain(l);
}
function explain(l){
  app.innerHTML=`<div class="tag">Say it back</div><h2>In your own words</h2>
    <p class="q">${l.explain}</p>
    <textarea id="ans" placeholder="Type it as if you're talking to a client."></textarea>
    ${S.key?`<button class="btn ghost" id="grade" style="margin-top:14px">Grade my explanation</button>`:""}
    <div id="gradeout"></div>
    <button class="btn primary" id="next" style="margin-top:14px">Practice</button>`;
  if(S.key)$("grade").onclick=async()=>{
    const txt=$("ans").value.trim();if(!txt){$("gradeout").innerHTML=`<p class="sub" style="margin-top:12px">Write something first.</p>`;return}
    $("grade").disabled=true;$("gradeout").innerHTML=`<p class="sub" style="margin-top:12px">Checking…</p>`;
    try{
      const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":S.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:S.model,max_tokens:500,system:"You grade a tax preparer's explanation for the IRS Enrolled Agent exam, Part 1, 2025 law. Compare it to the lesson rules. Reply in under 120 words, plain text: first line a score out of 10, then what they got right, then what's missing or wrong (be specific — name the rule or number), then one sentence on how to say it better. Warm but direct.",
          messages:[{role:"user",content:`Lesson rules:\n${l.rules.map(x=>x.replace(/<[^>]+>/g,"")).join("\n")}\n\nPrompt: ${l.explain}\n\nMy explanation: ${txt}`}]})});
      const d=await r.json();if(d.error)throw new Error(d.error.message);
      $("gradeout").innerHTML=`<div class="explain" style="border-top:0;background:var(--green-soft);border-radius:8px;padding:12px 14px;margin-top:12px;white-space:pre-line">${esc(d.content.filter(b=>b.type==="text").map(b=>b.text).join(""))}</div>`;
    }catch(e){$("gradeout").innerHTML=`<p class="sub" style="margin-top:12px">Couldn't grade: ${esc(e.message)}</p>`}
    $("grade").disabled=false;
  };
  $("next").onclick=()=>runQuiz(l.questions.map((q,i)=>({l,q,i,title:l.title})),()=>{S.done[l.id]=today();save();recap(l)});
}

/* ---- Quiz ---- */
function runQuiz(items,onDone){
  let idx=0,score=0;
  function show(){
    if(idx>=items.length){result(score,items.length,onDone);return}
    const it=items[idx];
    const vk=it.l?it.l.id+"#"+it.i:null;
    const q=(it.review&&vk&&VARY[vk])?VARY[vk]():it.q;
    it.shown=q;
    app.innerHTML=`<div class="progress"><i style="width:${idx/items.length*100}%"></i></div>
      <div class="tag ${it.review?"review":""}">${it.pretest?"Pre-test":it.review?"Review":it.gen?"AI practice":"Practice"} · ${it.title} · ${idx+1} of ${items.length}</div>
      <p class="q">${esc(q.q)}</p>
      <div id="optwrap" ${S.hideOpts===false?"":'style="display:none"'}>${q.options.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div>
      ${S.hideOpts===false?"":`<p class="sub">Say the answer in your head first.</p><button class="btn ghost" id="reveal">Show choices</button>`}
      <div id="conf" style="display:none"><p class="sub" style="margin:14px 0 8px">How sure are you?</p><div style="display:flex;gap:8px">${["Sure","Think so","Guessing"].map((c,ci)=>`<button class="btn ghost" data-c="${ci}" style="font-size:15px;padding:12px 8px">${c}</button>`).join("")}</div></div>
      <div id="fb"></div>`;
    window.scrollTo(0,0);
    if($("reveal"))$("reveal").onclick=()=>{$("optwrap").style.display="";$("reveal").remove()};
    let picked=null;
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(picked!==null)return;
      picked=b;app.querySelectorAll(".opt").forEach(x=>x.style.opacity=x===b?"1":".5");
      $("conf").style.display="";$("conf").scrollIntoView({block:"nearest"});
    });
    app.querySelectorAll("[data-c]").forEach(cb=>cb.onclick=()=>{
      const b=picked,conf=+cb.dataset.c;$("conf").style.display="none";app.querySelectorAll(".opt").forEach(x=>x.style.opacity="1");
      const i=+b.dataset.i,ok=i===q.answer;
      if(ok)score++;
      if(!it.pretest)schedule(it,ok,conf);
      app.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.i===q.answer)x.classList.add("correct")});
      if(!ok)b.classList.add("wrong");
      $("fb").innerHTML=`<div class="explain ${ok?"ok":""}">${ok?(conf===2?"Right — but you were guessing, so it comes back tomorrow. ":conf===1?"Right. Coming back soon since you weren't sure. ":"Right. "):"Not quite. "}${esc(q.why)}</div>
        <div id="more"></div>
        <div style="display:flex;gap:10px;margin-top:14px">
          ${ok?"":`<button class="btn ghost" id="expl" style="font-size:15px">Explain it differently</button>`}
          <button class="btn ghost" id="irs" style="font-size:15px">Check against IRS</button>
          <button class="btn ghost" id="flag" style="font-size:15px">${S.flags&&S.flags[cardKey(it)]?"Flagged ✓":"Flag & note"}</button>
        </div>
        <button class="btn primary" id="cont" style="margin-top:10px">${idx+1<items.length?"Next":"Finish"}</button>`;
      $("cont").onclick=()=>{idx++;show()};
      $("flag").onclick=()=>flagQuestion(it,q);
      $("irs").onclick=()=>checkIRS(q,it);
      if(!ok)$("expl").onclick=()=>explainDifferently(q,q.options[i]);
    });
  }
  show();
}
const IRS_TOOL={type:"web_search_20250305",name:"web_search",max_uses:4,allowed_domains:["irs.gov"]};
async function askClaude({system,user,max_tokens=800,tools}){
  const body={model:S.model,max_tokens,system,messages:[{role:"user",content:user}]};if(tools)body.tools=tools;
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":S.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify(body)});
  const d=await r.json();if(d.error)throw new Error(d.error.message||"API error");
  return (d.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
}
async function checkIRS(q,it){
  const box=$("more");
  if(!S.key){box.innerHTML=`<p class="sub" style="margin-top:12px">Add your API key in settings to use this.</p>`;return}
  box.innerHTML=`<p class="sub" style="margin-top:12px">Searching irs.gov… about 30 seconds.</p>`;
  try{
    const txt=await askClaude({tools:[IRS_TOOL],max_tokens:1200,
      system:"You verify Enrolled Agent exam practice questions against official IRS sources for tax year 2025. Search irs.gov (publications, form instructions, newsroom) and answer in plain text under 180 words: line 1 — VERDICT: Correct / Incorrect / Partly correct. Then the rule as the IRS states it, with the publication or form-instruction name and section. If the practice question is wrong, give the right answer and number. Note if a 2025 law change affects it. No markdown headers.",
      user:`Question: ${q.q}\nOptions: ${q.options.map((o,i)=>String.fromCharCode(65+i)+". "+o).join(" | ")}\nMarked correct: ${q.options[q.answer]}\nApp's explanation: ${q.why}`});
    box.innerHTML=`<div class="explain" style="border-top:0;background:#fff;border:1px solid var(--green);border-radius:8px;padding:12px 14px;white-space:pre-line">${esc(txt)}</div>`;
    if(/VERDICT:\s*(Incorrect|Partly)/i.test(txt)){S.flags=S.flags||{};const k=cardKey(it);if(!S.flags[k])S.flags[k]={q:q.q,answer:q.options[q.answer],why:q.why,note:"IRS check: "+txt.slice(0,300),topic:it.title,date:Date.now()};save();const b=$("flag");if(b)b.textContent="Flagged ✓"}
  }catch(e){box.innerHTML=`<p class="sub" style="margin-top:12px">Couldn't check: ${esc(e.message)}</p>`}
}
function flagQuestion(it,q){
  const k=cardKey(it);S.flags=S.flags||{};
  const note=prompt("Add a note (why you doubt it, or what confused you):",S.flags[k]?S.flags[k].note:"");
  if(note===null)return;
  S.flags[k]={q:q.q,answer:q.options[q.answer],why:q.why,note,topic:it.title,date:Date.now()};save();
  const b=$("flag");if(b)b.textContent="Flagged ✓";
}
async function explainDifferently(q,wrong){
  const box=$("more");
  if(!S.key){box.innerHTML=`<p class="sub" style="margin-top:12px">Add your API key in settings to use this.</p>`;return}
  box.innerHTML=`<p class="sub" style="margin-top:12px">Thinking…</p>`;
  try{
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":S.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:S.model,max_tokens:600,system:"You tutor a tax preparer studying for the IRS Enrolled Agent exam (Part 1, 2025 law). Explain like a patient teacher talking to a high-school beginner: plain words, short sentences, one simple analogy if it helps, then one worked example with small round numbers. Under 150 words. No markdown headers.",
        messages:[{role:"user",content:`Question: ${q.q}\nCorrect answer: ${q.options[q.answer]}\nI picked: ${wrong}\nOfficial explanation: ${q.why}\n\nExplain it differently so it clicks, and show me why my answer was wrong.`}]})});
    const d=await r.json();if(d.error)throw new Error(d.error.message);
    box.innerHTML=`<div class="explain" style="border-top:0;background:var(--green-soft);border-radius:8px;padding:12px 14px">${esc(d.content.filter(b=>b.type==="text").map(b=>b.text).join(""))}</div>`;
  }catch(e){box.innerHTML=`<p class="sub" style="margin-top:12px">Couldn't get an explanation: ${esc(e.message)}</p>`}
}
function flagsScreen(){
  const fl=Object.entries(S.flags||{});
  app.innerHTML=`<h2>Flagged questions</h2><p class="sub">${fl.length?"Copy the list and paste it into a chat with Claude to review together.":"Nothing flagged yet. Use \"Flag & note\" on any question."}</p>
    ${fl.length?`<button class="btn primary" id="copy">Copy for chat</button>`:""}
    ${fl.map(([k,f])=>`<div class="home-card"><p style="color:var(--muted);font-size:13px;margin-bottom:6px">${esc(f.topic)}</p><p style="color:var(--ink);font-family:var(--serif);font-size:16px">${esc(f.q)}</p><p style="color:var(--green);margin-top:6px">Answer: ${esc(f.answer)}</p>${f.note?`<p style="margin-top:6px;font-style:italic">Note: ${esc(f.note)}</p>`:""}<button data-k="${k}" style="background:none;border:0;color:var(--red);font:600 14px var(--sans);padding:8px 0 0">Remove flag</button></div>`).join("")}
    <button class="btn ghost" id="back">Back</button>`;
  $("back").onclick=home;
  app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{delete S.flags[b.dataset.k];save();flagsScreen()});
  if(fl.length)$("copy").onclick=()=>{const txt="Please review these EA Part 1 questions I flagged:\n\n"+fl.map(([k,f],n)=>`${n+1}. [${f.topic}] ${f.q}\n   App's answer: ${f.answer}\n   App's reason: ${f.why}${f.note?"\n   My note: "+f.note:""}`).join("\n\n");navigator.clipboard.writeText(txt).then(()=>{$("copy").textContent="Copied ✓"})};
}
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function result(score,total,onDone){
  const pct=Math.round(score/total*100);
  app.innerHTML=`<h2>Round complete</h2><div class="score">${score}/${total}</div>
    <p class="sub">${pct>=80?"Solid. Missed ones come back tomorrow.":"Missed ones reset to a 1-day review. That's how it should work."}</p>
    <button class="btn primary" id="next">Continue</button>`;
  $("next").onclick=onDone;
}
function recap(l){
  app.innerHTML=`<div class="tag">Last step</div><h2>One-line recap</h2>
    <p class="recap">Write the single thing from "${l.title}" you most want to remember next week.</p>
    <textarea id="rc" placeholder="One line."></textarea>
    <button class="btn primary" id="done" style="margin-top:14px">Done for today</button>`;
  $("done").onclick=()=>{const v=$("rc").value.trim();if(v){S.recaps=S.recaps||{};S.recaps[l.id]=v;save()}home()};
}
home();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
